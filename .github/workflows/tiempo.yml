name: Consejo del tiempo (Gemini)

on:
  schedule:
    # Mañana ~5:40 (con las cenas) y tarde ~15:40 (antes de ir a buscar al peque), hora de Madrid.
    # Va dos veces (invierno/verano); el script solo trabaja una vez por tanda.
    - cron: "40 3,4 * * *"
    - cron: "40 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  tiempo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pedir el consejo a Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          PROGRAMADO: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/tiempo.mjs
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gemini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tiempo.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Tiempo $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
